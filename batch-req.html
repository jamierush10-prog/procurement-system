<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Batch Upload Requisitions</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 40px; background: #f4f4f9; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .drop-zone { border: 3px dashed #6f42c1; padding: 40px; background: #f3e5f5; margin: 20px 0; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .drop-zone:hover { background: #e1bee7; border-color: #4a148c; }
        h2 { color: #6f42c1; }
        .back-link { display: block; margin-top: 20px; color: #666; text-decoration: none; }
        #log { text-align: left; background: #333; color: #0f0; padding: 15px; height: 300px; overflow-y: auto; border-radius: 6px; font-family: monospace; display: none; }
        .code-snippet { background:#eee; padding:2px 6px; border-radius:4px; font-weight:bold; font-size: 0.9em; margin: 0 2px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <div class="container">
        <h2>⚡ Batch Upload Requisitions</h2>
        <p>Upload Excel file with headers:</p> 
        <div style="line-height: 2em; margin-bottom: 20px;">
            <span class="code-snippet">PartNo</span>
            <span class="code-snippet">ReqID</span>
            <span class="code-snippet">Buyer</span>
            <span class="code-snippet">Hull</span>
            <span class="code-snippet">Qty</span>
            <span class="code-snippet">UOM</span>
            <span class="code-snippet">Budget</span> <span class="code-snippet">Selected</span> <span class="code-snippet">Description</span>
        </div>

        <div class="drop-zone" id="dropZone">
            <h3>📂 Drag & Drop Excel File</h3>
            <p>or click to browse</p>
            <input type="file" id="fileInput" style="display:none" accept=".xlsx, .xls">
        </div>

        <div id="log"></div>
        <a href="index.html" class="back-link">&#8592; Back to Dashboard</a>
    </div>

    <script type="module">
        import { db, doc, getDoc, setDoc, updateDoc, arrayUnion } from './firebase-config.js';

        if (!sessionStorage.getItem("austal_user")) window.location.href = "login.html";

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const logBox = document.getElementById('log');

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.background = '#e1bee7'; };
        dropZone.ondrop = (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function log(msg) {
            logBox.style.display = "block";
            const div = document.createElement("div");
            div.textContent = `> ${msg}`;
            logBox.prepend(div);
        }

        async function handleFile(file) {
            log(`Reading ${file.name}...`);
            const reader = new FileReader();
            
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet);

                    log(`Found ${rows.length} rows. Processing...`);

                    for (const row of rows) {
                        if (!row.PartNo || !row.ReqID) continue;

                        const partNo = row.PartNo.toString().toUpperCase().trim();
                        
                        const reqItem = {
                            reqId: row.ReqID.toString(),
                            buyer: row.Buyer ? row.Buyer.toString() : "",
                            hull: row.Hull ? row.Hull.toString() : "",
                            qtyReq: Number(row.Qty || 1),
                            uom: row.UOM ? row.UOM.toString() : "EA",
                            
                            // --- NEW FIELDS ---
                            budget: Number(row.Budget || 0),
                            selected: row.Selected ? row.Selected.toString() : "",
                            // ------------------

                            status: "Open",
                            dateAdded: new Date().toISOString()
                        };

                        const docRef = doc(db, "parts", partNo);
                        const docSnap = await getDoc(docRef);

                        if (docSnap.exists()) {
                            await updateDoc(docRef, {
                                requisitions: arrayUnion(reqItem),
                                desc: row.Description || docSnap.data().desc
                            });
                            log(`[${partNo}] Added Req ${reqItem.reqId}`);
                        } else {
                            await setDoc(docRef, {
                                partNo: partNo,
                                desc: row.Description || "Imported Part",
                                requisitions: [reqItem],
                                quotes: [] 
                            });
                            log(`[${partNo}] Created New Part + Req`);
                        }
                    }
                    log("✅ Upload Complete!");
                } catch (err) {
                    log("ERROR: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
