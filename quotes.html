<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote History Search</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        
        /* Header */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 3px solid #6f42c1; padding-bottom: 10px; }
        h2 { color: #6f42c1; margin: 0; display: flex; align-items: center; }
        
        /* Buttons */
        .btn-red { padding: 8px 16px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; }
        .btn-red:hover { background-color: #c82333; }
        
        .btn-search-main { 
            padding: 10px 25px; background-color: #0056b3; color: white; border: none; border-radius: 4px; 
            font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-search-main:hover { background-color: #004494; }

        /* Table */
        .table-container { width: 100%; overflow-x: auto; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; height: 75vh; }
        table { width: 100%; border-collapse: collapse; min-width: 1800px; white-space: nowrap; font-size: 13px; }
        thead th { position: sticky; top: 0; background-color: #6f42c1; color: white; padding: 8px 10px; text-align: left; z-index: 10; }
        tbody td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        tbody tr:hover { background-color: #f1f1f1; }

        /* Inputs */
        .col-search { width: 90%; padding: 4px; margin-top: 5px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; color: #333; }
        .col-currency { text-align: right; font-family: monospace; font-weight: bold; }

        /* Badges */
        .rank-badge { padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; font-size: 0.9em; }
        
        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; margin-top: 20px; gap: 20px; }
        .btn-nav { padding: 8px 16px; background-color: #6f42c1; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-nav:disabled { background-color: #ccc; cursor: not-allowed; opacity: 0.7; }

        /* Status Bar */
        #statusBar { 
            background: #e2e3e5; color: #383d41; padding: 10px; margin-bottom: 15px; 
            border-radius: 4px; border: 1px solid #d6d8db; font-size: 13px; font-family: monospace; display:none;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div style="display:flex; align-items:center; gap: 20px;">
            <h2>🔍 Quote History Search</h2>
            <button onclick="executeSearch()" class="btn-search-main">🔍 Run Search</button>
        </div>
        <a href="index.html" class="btn-red">Close & Refresh</a>
    </div>

    <div id="statusBar"></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width:120px;">Part No<br><input type="text" id="s_part" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th style="min-width:200px;">Description<br><input type="text" id="s_desc" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th>SPMIG<br><input type="text" id="s_spmig" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th>NSN<br><input type="text" id="s_nsn" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th>Supplier<br><input type="text" id="s_supplier" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th>Rank<br><input type="text" id="s_rank" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th>Quote Date<br><input type="text" id="s_date" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th>Price<br><input type="text" id="s_price" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th>MFG Part No<br><input type="text" id="s_mfg" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th>Quote File<br><input type="text" id="s_file" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th>Qty<br><input type="text" id="s_qty" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                    <th>Lead Time<br><input type="text" id="s_lead" class="col-search" placeholder="Type..." onkeyup="if(event.key==='Enter') executeSearch()"></th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="12" style="text-align:center; padding:30px; color:#666;">Enter criteria above and click <b>Run Search</b> to find records.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="paginationControls"></div>

    <script type="module">
        import { db, collection, getDocs, query, where, orderBy, limit, startAt, endAt } from './firebase-config.js';

        // Auth Check
        if (!sessionStorage.getItem("austal_user") && !localStorage.getItem("austal_user")) {
            window.location.href = "login.html";
        }

        const tbody = document.getElementById('tableBody');
        const statusDiv = document.getElementById('statusBar');
        const paginationDiv = document.getElementById('paginationControls');

        let flatData = [];
        let currentPage = 1;
        const itemsPerPage = 100;

        function updateStatus(msg, color='black') {
            statusDiv.style.display = 'block';
            statusDiv.textContent = msg;
            statusDiv.style.color = color;
        }

        // 1. EXECUTE SEARCH (The Engine)
        window.executeSearch = async () => {
            // Clear current
            flatData = [];
            tbody.innerHTML = "<tr><td colspan='12' style='text-align:center; padding:20px;'>Searching Database...</td></tr>";
            updateStatus("Searching...", "blue");

            // Gather inputs
            const s_part = document.getElementById('s_part').value.trim();
            const s_supplier = document.getElementById('s_supplier').value.trim();
            const s_desc = document.getElementById('s_desc').value.trim().toUpperCase(); // For client filtering

            try {
                let querySnapshot;

                // STRATEGY: Find the most specific search term provided
                if (s_part) {
                    // Search by Part Number (Primary Key - Very Fast)
                    // We use >= and <= to simulate "Starts With" behavior
                    const q = query(
                        collection(db, "parts"), 
                        where("partNo", ">=", s_part),
                        where("partNo", "<=", s_part + '\uf8ff'),
                        limit(500) // Safety limit
                    );
                    querySnapshot = await getDocs(q);
                } 
                else if (s_supplier) {
                    // Search by Supplier requires an index, skipping to full scan fallback if needed or client-side match
                    // Since "quotes" is an array, searching inside it directly via simple query is hard.
                    // We will fallback to a recent scan for supplier if no part no is given.
                    alert("For speed, please search by Part Number. Searching by Supplier performs a limited recent scan.");
                    const q = query(collection(db, "parts"), limit(2000));
                    querySnapshot = await getDocs(q);
                } 
                else {
                    // Empty search? Load recent 100
                    const q = query(collection(db, "parts"), limit(100));
                    querySnapshot = await getDocs(q);
                }

                // Process Results
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    
                    // Filter: Client side double-check (useful for Description filter)
                    if (s_desc && (!data.desc || !data.desc.toUpperCase().includes(s_desc))) return;

                    if (data.quotes && data.quotes.length > 0) {
                        data.quotes.forEach(quote => {
                            // Filter: Supplier check if entered
                            if (s_supplier && (!quote.supplier || !quote.supplier.toUpperCase().includes(s_supplier.toUpperCase()))) return;

                            flatData.push({
                                partNo: data.partNo || "",
                                desc: data.desc || "",
                                spmig: data.spmig || "", 
                                nsn: data.nsn || "",     
                                supplier: quote.supplier || "",
                                rank: (quote.rank || 999).toString(),
                                date: quote.date || "",
                                price: quote.price ? parseFloat(quote.price).toFixed(2) : "0.00",
                                mfg: quote.mfg || "",
                                file: quote.file || "",
                                qty: (quote.qty || 1).toString(),
                                lead: quote.lead || ""
                            });
                        });
                    }
                });

                if (flatData.length === 0) {
                    updateStatus("No matching records found.", "red");
                    tbody.innerHTML = "<tr><td colspan='12' style='text-align:center; padding:20px;'>No records found.</td></tr>";
                } else {
                    updateStatus(`Found ${flatData.length} records.`, "green");
                    renderTable();
                }

            } catch (err) {
                console.error(err);
                updateStatus("Error: " + err.message, "red");
                tbody.innerHTML = `<tr><td colspan='12' style='color:red; text-align:center;'>Error: ${err.message}</td></tr>`;
            }
        };

        // 2. RENDER TABLE
        function renderTable() {
            tbody.innerHTML = "";
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = flatData.slice(startIndex, endIndex);

            pageData.forEach(row => {
                let rankColor = "#ccc";
                if(row.rank === '1') rankColor = "#28a745";
                if(row.rank === '2') rankColor = "#ffc107";

                const tr = `
                    <tr>
                        <td style="font-weight:bold; color:#6f42c1;">${row.partNo}</td>
                        <td>${row.desc}</td>
                        <td>${row.spmig}</td>
                        <td>${row.nsn}</td>
                        <td>${row.supplier}</td>
                        <td><span class="rank-badge" style="background:${rankColor}">${row.rank}</span></td>
                        <td>${row.date}</td>
                        <td class="col-currency">$${row.price}</td>
                        <td>${row.mfg}</td>
                        <td>${row.file}</td>
                        <td>${row.qty}</td>
                        <td>${row.lead}</td>
                    </tr>
                `;
                tbody.innerHTML += tr;
            });
            updateControls();
        }

        function updateControls() {
            const totalPages = Math.ceil(flatData.length / itemsPerPage) || 1;
            paginationDiv.innerHTML = `
                <button onclick="prevPage()" class="btn-nav" ${currentPage===1?'disabled':''}>&#8592; Previous</button>
                <span style="font-weight:bold; margin: 0 15px;">Page ${currentPage} of ${totalPages} (${flatData.length} records)</span>
                <button onclick="nextPage()" class="btn-nav" ${currentPage===totalPages?'disabled':''}>Next &#8594;</button>
            `;
        }

        // Global functions
        window.executeSearch = executeSearch;
        window.prevPage = () => { if(currentPage > 1) { currentPage--; renderTable(); } };
        window.nextPage = () => { if(currentPage < Math.ceil(flatData.length/itemsPerPage)) { currentPage++; renderTable(); } };

    </script>
</body>
</html>
