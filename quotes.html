<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote History Search</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        
        /* Header */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 3px solid #6f42c1; padding-bottom: 10px; }
        h2 { color: #6f42c1; margin: 0; display: flex; align-items: center; }
        
        /* Buttons */
        .btn-red { 
            padding: 8px 16px; background-color: #dc3545; color: white; text-decoration: none; 
            border-radius: 4px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; 
        }
        .btn-red:hover { background-color: #c82333; }

        /* Table */
        .table-container { width: 100%; overflow-x: auto; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; height: 75vh; }
        table { width: 100%; border-collapse: collapse; min-width: 1800px; white-space: nowrap; font-size: 13px; }
        thead th { position: sticky; top: 0; background-color: #6f42c1; color: white; padding: 8px 10px; text-align: left; z-index: 10; }
        tbody td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        tbody tr:hover { background-color: #f1f1f1; }

        /* Inputs */
        .col-search { width: 90%; padding: 4px; margin-top: 5px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; color: #333; }
        .col-currency { text-align: right; font-family: monospace; font-weight: bold; }

        /* Badges */
        .rank-badge { padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; font-size: 0.9em; }
        
        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; margin-top: 20px; gap: 20px; }
        .btn-nav { padding: 8px 16px; background-color: #6f42c1; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-nav:disabled { background-color: #ccc; cursor: not-allowed; opacity: 0.7; }

        /* Status Bar */
        #statusBar { 
            background: #e2e3e5; color: #383d41; padding: 10px; margin-bottom: 15px; 
            border-radius: 4px; border: 1px solid #d6d8db; font-size: 13px; font-family: monospace; display:block;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>🔍 Quote History Search</h2>
        <a href="index.html" class="btn-red">Close & Refresh</a>
    </div>

    <div id="statusBar">Initializing...</div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width:120px;">Part No<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th style="min-width:200px;">Description<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>SPMIG<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>NSN<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Supplier<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Rank<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Quote Date<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Price<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>MFG Part No<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Quote File<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Qty<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Lead Time<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pagination" id="paginationControls"></div>

    <script type="module">
        import { db, collection, getDocs, query, limit, orderBy, startAfter } from './firebase-config.js';

        // Auth Check
        if (!sessionStorage.getItem("austal_user") && !localStorage.getItem("austal_user")) {
            window.location.href = "login.html";
        }

        const tbody = document.getElementById('tableBody');
        const statusDiv = document.getElementById('statusBar');
        const paginationDiv = document.getElementById('paginationControls');

        let flatData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 100;

        // 1. AUTO-RUN CHUNKED LOADER
        window.loadQuotes = async () => {
            statusDiv.textContent = "Connecting to database...";
            tbody.innerHTML = "<tr><td colspan='12' style='text-align:center; padding:20px;'>Loading records...</td></tr>";

            flatData = [];
            const CHUNK_SIZE = 2000; // Smaller chunks are safer
            let lastDoc = null;
            let keepScanning = true;
            let totalScanned = 0;

            try {
                // Loop until no more data
                while (keepScanning) {
                    let q;
                    // Construct Query
                    if (lastDoc) {
                        q = query(collection(db, "parts"), orderBy("partNo"), startAfter(lastDoc), limit(CHUNK_SIZE));
                    } else {
                        q = query(collection(db, "parts"), orderBy("partNo"), limit(CHUNK_SIZE));
                    }

                    // Execute
                    const snapshot = await getDocs(q);

                    // Check if done
                    if (snapshot.empty) {
                        keepScanning = false;
                        break;
                    }

                    // Process Data
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        
                        // Add rows for every quote found
                        if (data.quotes && data.quotes.length > 0) {
                            data.quotes.forEach(quote => {
                                flatData.push({
                                    partNo: data.partNo || "",
                                    desc: data.desc || "",
                                    spmig: data.spmig || "", 
                                    nsn: data.nsn || "",     
                                    supplier: quote.supplier || "",
                                    rank: (quote.rank || 999).toString(),
                                    date: quote.date || "",
                                    price: quote.price ? parseFloat(quote.price).toFixed(2) : "0.00",
                                    mfg: quote.mfg || "",
                                    file: quote.file || "",
                                    qty: (quote.qty || 1).toString(),
                                    lead: quote.lead || ""
                                });
                            });
                        }
                    });

                    // Update Status & Table
                    totalScanned += snapshot.size;
                    statusDiv.textContent = `Loading... Scanned ${totalScanned} records. Found ${flatData.length} quotes.`;
                    filterData(); // Update screen immediately

                    // Set cursor for next loop
                    lastDoc = snapshot.docs[snapshot.docs.length - 1];
                    
                    // Safety break (30k max)
                    if (totalScanned > 30000) keepScanning = false; 
                }

                statusDiv.textContent = `Done. Loaded ${flatData.length} quotes.`;
                statusDiv.style.color = "green";
                statusDiv.style.fontWeight = "bold";

            } catch (err) {
                console.error(err);
                statusDiv.textContent = "Error: " + err.message;
                statusDiv.style.color = "red";
            }
        };

        // 2. FILTER LOGIC
        window.filterData = () => {
            const inputs = document.querySelectorAll('.col-search');
            
            filteredData = flatData.filter(row => {
                if (!row.partNo.toUpperCase().includes(inputs[0].value.toUpperCase())) return false;
                if (!row.desc.toUpperCase().includes(inputs[1].value.toUpperCase())) return false;
                if (!row.spmig.toUpperCase().includes(inputs[2].value.toUpperCase())) return false;
                if (!row.nsn.toUpperCase().includes(inputs[3].value.toUpperCase())) return false;
                if (!row.supplier.toUpperCase().includes(inputs[4].value.toUpperCase())) return false;
                if (!row.rank.includes(inputs[5].value)) return false;
                if (!row.date.includes(inputs[6].value)) return false;
                if (!row.price.includes(inputs[7].value)) return false;
                if (!row.mfg.toUpperCase().includes(inputs[8].value.toUpperCase())) return false;
                if (!row.file.toUpperCase().includes(inputs[9].value.toUpperCase())) return false;
                if (!row.qty.includes(inputs[10].value)) return false;
                if (!row.lead.toUpperCase().includes(inputs[11].value.toUpperCase())) return false;
                return true;
            });

            // If user typing, stay on page 1
            if(document.activeElement.tagName === "INPUT") currentPage = 1;
            
            renderTable();
        };

        // 3. RENDER TABLE
        function renderTable() {
            tbody.innerHTML = "";
            if (filteredData.length === 0) {
                const msg = flatData.length === 0 ? "Loading records..." : "No quotes found.";
                tbody.innerHTML = `<tr><td colspan='12' style='text-align:center; padding:20px;'>${msg}</td></tr>`;
                updateControls();
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);

            pageData.forEach(row => {
                let rankColor = "#ccc";
                if(row.rank === '1') rankColor = "#28a745";
                if(row.rank === '2') rankColor = "#ffc107";

                const tr = `
                    <tr>
                        <td style="font-weight:bold; color:#6f42c1;">${row.partNo}</td>
                        <td>${row.desc}</td>
                        <td>${row.spmig}</td>
                        <td>${row.nsn}</td>
                        <td>${row.supplier}</td>
                        <td><span class="rank-badge" style="background:${rankColor}">${row.rank}</span></td>
                        <td>${row.date}</td>
                        <td class="col-currency">$${row.price}</td>
                        <td>${row.mfg}</td>
                        <td>${row.file}</td>
                        <td>${row.qty}</td>
                        <td>${row.lead}</td>
                    </tr>
                `;
                tbody.innerHTML += tr;
            });
            updateControls();
        }

        function updateControls() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
            paginationDiv.innerHTML = `
                <button onclick="prevPage()" class="btn-nav" ${currentPage===1?'disabled':''}>&#8592; Previous</button>
                <span style="font-weight:bold; margin: 0 15px;">Page ${currentPage} of ${totalPages} (${filteredData.length} records)</span>
                <button onclick="nextPage()" class="btn-nav" ${currentPage===totalPages?'disabled':''}>Next &#8594;</button>
            `;
        }

        // Global functions
        window.filterData = filterData;
        window.prevPage = () => { if(currentPage > 1) { currentPage--; renderTable(); } };
        window.nextPage = () => { if(currentPage < Math.ceil(filteredData.length/itemsPerPage)) { currentPage++; renderTable(); } };

        // Start immediately
        document.addEventListener("DOMContentLoaded", loadQuotes);

    </script>
</body>
</html>
