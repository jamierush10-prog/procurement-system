<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Requisition Line</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        
        .card {
            background: white; width: 500px; padding: 30px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        h2 { color: #0056b3; margin-top: 0; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; color: #333; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 12px; border: none; background: #28a745; color: white; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #218838; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }

        /* Status Messages */
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="card">
        <h2>➕ Add Requisition Line</h2>

        <div class="form-group">
            <label>Part Number (Required)</label>
            <input type="text" id="partNo" placeholder="e.g. VAL-992-X">
        </div>

        <div class="form-group">
            <label>Description</label>
            <input type="text" id="desc" placeholder="Part Description">
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="width: 50%;">
                <label>Req ID</label>
                <input type="text" id="reqId" placeholder="REQ-2025-001">
            </div>
            <div class="form-group" style="width: 50%;">
                <label>Hull / Project</label>
                <input type="text" id="hull" placeholder="LCS-38">
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="width: 50%;">
                <label>Qty Required</label>
                <input type="number" id="qty" value="1">
            </div>
            <div class="form-group" style="width: 50%;">
                <label>UOM</label>
                <select id="uom">
                    <option>EA</option><option>FT</option><option>SET</option><option>BX</option><option>KG</option>
                </select>
            </div>
        </div>

        <button id="btnSave" class="btn">Save to Cloud</button>
        <div id="status"></div>

        <a href="index.html" class="back-link">&#8592; Back to Master List</a>
    </div>

    <script type="module">

        // --- SECURITY CHECK ---
if (!sessionStorage.getItem("austal_user")) {
    window.location.href = "login.html";
}
// ----------------------

        import { db, doc, setDoc, getDoc, updateDoc, arrayUnion } from './firebase-config.js';

        // 1. Attach Event Listener safely
        document.getElementById('btnSave').addEventListener('click', saveReq);

        // 2. The Save Function
        async function saveReq() {
            const btn = document.getElementById('btnSave');
            const statusBox = document.getElementById('status');
            const partInput = document.getElementById('partNo');
            
            // Force Uppercase
            const partNo = partInput.value.toUpperCase().trim();
            
            if (!partNo) {
                showStatus("Error: Part Number is required.", "error");
                return;
            }

            // Visual Feedback
            btn.disabled = true;
            btn.textContent = "Saving...";
            statusBox.style.display = 'none';

            // Create the specific Requisition Object
            const newReqItem = {
                reqId: document.getElementById('reqId').value,
                hull: document.getElementById('hull').value,
                qtyReq: Number(document.getElementById('qty').value),
                uom: document.getElementById('uom').value,
                status: "Open",
                dateAdded: new Date().toISOString()
            };

            try {
                const docRef = doc(db, "parts", partNo);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    // Part exists: Append this new Req to the list using arrayUnion
                    // Also update description if the user typed one
                    const updateData = {
                        requisitions: arrayUnion(newReqItem)
                    };
                    
                    const descVal = document.getElementById('desc').value;
                    if(descVal) updateData.desc = descVal;

                    await updateDoc(docRef, updateData);
                } else {
                    // Part is new: Create the shell and add the first Req
                    await setDoc(docRef, {
                        partNo: partNo,
                        desc: document.getElementById('desc').value,
                        requisitions: [newReqItem], // Start the list
                        quotes: [] // Start empty quotes
                    });
                }

                showStatus(`✅ Success! Linked Req ${newReqItem.reqId} to Part ${partNo}.`, "success");
                
                // Clear Form (keep part number focused for rapid entry)
                document.getElementById('reqId').value = "";
                document.getElementById('hull').value = "";
                document.getElementById('qty').value = "1";
                document.getElementById('reqId').focus();

            } catch (err) {
                console.error(err);
                showStatus("Error: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Save to Cloud";
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
