<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Quote</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: white; width: 600px; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-top: 0; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; color: #333; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        
        .btn { width: 100%; padding: 12px; border: none; background: #0056b3; color: white; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #004494; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
        
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="card">
        <h2>💲 Add New Quote</h2>

        <div class="form-group">
            <label>Part Number (Must match existing Req)</label>
            <input type="text" id="partNo" placeholder="e.g. VAL-992-X">
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label>Supplier Name</label>
                    <input type="text" id="supplier" placeholder="Acme Supply">
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label>Rank</label>
                    <select id="rank">
                        <option value="1">1 (Winner)</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="99" selected>No Rank</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label>Price (USD)</label>
                    <input type="number" id="price" step="0.01" placeholder="0.00">
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label>Qty Quoted</label>
                    <input type="number" id="qty" value="1">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label>Lead Time</label>
                    <input type="text" id="lead" placeholder="14 Days">
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label>Validity</label>
                    <input type="text" id="valid" placeholder="30 Days">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Notes</label>
            <textarea id="notes" rows="2" placeholder="Any details..."></textarea>
        </div>

        <button id="btnSave" class="btn">Add Quote to History</button>
        <div id="status"></div>
        <a href="index.html" class="back-link">&#8592; Back to Master List</a>
    </div>

    <script type="module">

        // --- SECURITY CHECK ---
if (!sessionStorage.getItem("austal_user")) {
    window.location.href = "login.html";
}
// ----------------------

        import { db, doc, updateDoc, arrayUnion, getDoc, setDoc } from './firebase-config.js';

        // Check for URL param (e.g. ?part=VAL-123) to pre-fill
        const params = new URLSearchParams(window.location.search);
        if(params.get('part')) document.getElementById('partNo').value = params.get('part');

        document.getElementById('btnSave').addEventListener('click', saveQuote);

        async function saveQuote() {
            const btn = document.getElementById('btnSave');
            const partInput = document.getElementById('partNo');
            const partNo = partInput.value.toUpperCase().trim();
            
            if (!partNo) return showStatus("Part Number is required", "error");
            if (!document.getElementById('supplier').value) return showStatus("Supplier is required", "error");

            btn.disabled = true;
            btn.textContent = "Saving...";

            const newQuote = {
                supplier: document.getElementById('supplier').value,
                rank: Number(document.getElementById('rank').value),
                price: Number(document.getElementById('price').value),
                qty: Number(document.getElementById('qty').value),
                lead: document.getElementById('lead').value,
                valid: document.getElementById('valid').value,
                notes: document.getElementById('notes').value,
                date: new Date().toLocaleDateString('en-CA'), // YYYY-MM-DD
                timestamp: new Date().toISOString()
            };

            try {
                const docRef = doc(db, "parts", partNo);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    // Part exists, append quote to array
                    await updateDoc(docRef, {
                        quotes: arrayUnion(newQuote)
                    });
                    showStatus("✅ Quote Added Successfully!", "success");
                } else {
                    // Part doesn't exist yet
                    // We create the part shell and add the quote
                    const confirmCreate = confirm(`Part "${partNo}" does not exist in the database yet. Create it now?`);
                    if(confirmCreate) {
                        await setDoc(docRef, {
                            partNo: partNo,
                            desc: "Created via Quote",
                            reqId: "PENDING",
                            quotes: [newQuote]
                        });
                        showStatus("✅ Created new Part and added Quote.", "success");
                    } else {
                        throw new Error("Cancelled by user.");
                    }
                }
                
                // Clear fields except PartNo
                document.getElementById('supplier').value = "";
                document.getElementById('price').value = "";
                document.getElementById('notes').value = "";

            } catch (err) {
                console.error(err);
                showStatus("Error: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Add Quote to History";
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
