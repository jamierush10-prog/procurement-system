<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Austal Procurement Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #002b5c; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        .login-card {
            background: white; padding: 40px; border-radius: 8px; width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center;
        }
        
        h2 { color: #002b5c; margin-bottom: 20px; }
        .logo { font-size: 50px; margin-bottom: 10px; }
        
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button {
            width: 100%; padding: 12px; border: none; background: #d32029; color: white;
            font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer;
        }
        button:hover { background: #b01820; }
        
        #error-msg { color: red; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">🚢</div>
        <h2>Procurement Cloud</h2>
        
        <input type="email" id="email" placeholder="Email (@austalusa.com)">
        <input type="password" id="password" placeholder="Password">
        
        <button id="btnLogin">Log In</button>
        <div id="error-msg"></div>
    </div>

    <script type="module">
        import { db, collection, addDoc } from './firebase-config.js';

        document.getElementById('btnLogin').addEventListener('click', handleLogin);
        
        // Also allow pressing "Enter" key
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        async function handleLogin() {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-msg');
            const btn = document.getElementById('btnLogin');

            errorBox.style.display = 'none';

            // 1. VALIDATION
            if (!email.endsWith("@austalusa.com")) {
                showError("Access Denied: Must use an @austalusa.com email.");
                return;
            }

            if (password !== "scm2020") {
                showError("Incorrect Password.");
                return;
            }

            // 2. LOGGING ACCESS (The "Tracking" part)
            try {
                btn.textContent = "Verifying...";
                btn.disabled = true;

                // Save record to Firebase 'access_logs'
                await addDoc(collection(db, "access_logs"), {
                    user: email,
                    timestamp: new Date().toISOString(),
                    action: "LOGIN_SUCCESS",
                    device: navigator.userAgent // Tracks if they are on mobile/desktop
                });

                // 3. SET SESSION & REDIRECT
                // We save a "token" in the browser so they stay logged in until they close the tab
                sessionStorage.setItem("austal_user", email);
                
                window.location.href = "index.html";

            } catch (err) {
                console.error(err);
                showError("System Error: Could not verify login.");
                btn.disabled = false;
                btn.textContent = "Log In";
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
