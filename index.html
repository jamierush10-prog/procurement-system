<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rush Procurement Base</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        
        /* Header Layout */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #0056b3; margin: 0; }
        
        /* Buttons */
        .btn-add { 
            padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 14px; 
            transition: opacity 0.3s; color: white; display: inline-block; margin-left: 10px; cursor: pointer; border: none;
        }
        .btn-add:hover { opacity: 0.9; }
        
        .btn-grey   { background-color: #555; }       
        .btn-green  { background-color: #28a745; }    
        .btn-purple { background-color: #6f42c1; }    
        .btn-blue   { background-color: #0056b3; }    
        .btn-orange { background-color: #fd7e14; }    
        
        .btn-icon { padding: 5px 8px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: white; margin-right: 5px; }
        .btn-icon:hover { background: #eee; }
        .btn-del:hover { background: #ffe6e6; border-color: #ffcccc; color: red; }

        /* Table Container */
        .table-container { width: 100%; overflow-x: auto; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; height: 75vh; }
        
        table { width: 100%; border-collapse: collapse; min-width: 1800px; white-space: nowrap; font-size: 13px; }
        thead th { position: sticky; top: 0; background-color: #0056b3; color: white; padding: 8px 10px; text-align: left; z-index: 10; }
        tbody td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        tbody tr:hover { background-color: #f1f1f1; }

        /* Column Search Inputs */
        .col-search {
            width: 90%;
            padding: 4px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 12px;
            color: #333;
        }

        a.part-link { color: #0056b3; font-weight: bold; text-decoration: underline; cursor: pointer; }
        a.part-link:hover { color: #003366; }
        
        .col-currency { text-align: right; font-family: 'Courier New', monospace; font-weight: bold; }
        /* Updated Hull Badge for better contrast */
        .hull-badge { color: #333; border: 1px solid rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .req-badge { background-color: #e9ecef; color: #495057; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.85em; }
        .buyer-badge { color: #333; border: 1px solid rgba(0,0,0,0.1); padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 0.85em; }

        /* Pagination Controls */
        .pagination { display: flex; justify-content: center; align-items: center; margin-top: 20px; gap: 20px; }
        .page-info { font-weight: bold; color: #555; }
        .btn-nav { padding: 8px 16px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-nav:disabled { background-color: #ccc; cursor: not-allowed; opacity: 0.7; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: white; padding: 30px; border-radius: 8px; width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-title { margin-top: 0; color: #0056b3; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>Rush Procurement Base</h2>
        <div>
            <a href="quotes.html" class="btn-add btn-grey">🔍 Quote Search</a>
            <a href="add-req.html" class="btn-add btn-green">+ Add Req</a>
            <a href="batch-req.html" class="btn-add btn-purple">⚡ Batch Req</a>
            <a href="batch-quotes.html" class="btn-add btn-orange">⚡ Batch Quote</a>
            <a href="add-quote.html" class="btn-add btn-blue">+ Add Quote</a>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">Actions</th>
                    <th>Buyer<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Part No<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Req ID<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Hull<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Description<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Rank<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Best Supplier<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Quote Date<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>QTY<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Price<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Total<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Budget<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>T-Budget<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Selected<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Delta<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                    <th>Lead Time<br><input type="text" class="col-search" onkeyup="filterData()" placeholder="Search..."></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pagination" id="paginationControls">
        </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <h3 class="modal-title">✏️ Modify Requisition</h3>
            <input type="hidden" id="edit_partNo">
            
            <div class="form-group">
                <label>Req ID</label>
                <input type="text" id="edit_reqId">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="width:50%">
                    <label>Buyer (Initials)</label> 
                    <input type="text" id="edit_buyer">
                </div>
                <div class="form-group" style="width:50%">
                    <label>Selected (Status)</label> 
                    <input type="text" id="edit_selected">
                </div>
            </div>
            <div class="form-group">
                <label>Budget (Unit Price)</label> 
                <input type="number" id="edit_budget" step="0.01">
            </div>
            <div class="form-group">
                <label>Hull / Project</label>
                <input type="text" id="edit_hull">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="width:50%">
                    <label>Qty Required</label>
                    <input type="number" id="edit_qty">
                </div>
                <div class="form-group" style="width:50%">
                    <label>UOM</label>
                    <input type="text" id="edit_uom">
                </div>
            </div>
            <div class="form-group">
                <label>Description (Updates Main Part)</label>
                <input type="text" id="edit_desc">
            </div>
            
            <div class="modal-actions">
                <button type="button" onclick="closeModal()" class="btn-add" style="background:#ccc; color:#333;">Cancel</button>
                <button type="button" onclick="saveEdit()" class="btn-add btn-green">Save Changes</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, collection, getDocs, getDoc, doc, updateDoc, deleteDoc, query, where, limit } from './firebase-config.js';

        if (!sessionStorage.getItem("austal_user")) window.location.href = "login.html";

        const tbody = document.getElementById('tableBody');
        const paginationDiv = document.getElementById('paginationControls');

        // --- GLOBAL STATE ---
        let flatTableData = []; 
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 50;

        // --- COLOR GENERATOR ---
        function getColorForString(str) {
            if (!str) return '#e9ecef';
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const colors = [
                '#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', 
                '#a0c4ff', '#bdb2ff', '#ffc6ff', '#fffffc', '#ffe5d9'
            ];
            const index = Math.abs(hash % colors.length);
            return colors[index];
        }

        // 1. LOAD INITIAL DATA
        window.loadInitial = async () => {
            tbody.innerHTML = "<tr><td colspan='17' style='text-align:center; padding:20px;'>Loading full dashboard...</td></tr>";
            
            try {
                const q = query(collection(db, "parts"), limit(10000));
                const querySnapshot = await getDocs(q);
                
                flatTableData = [];

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.requisitions && data.requisitions.length > 0) {
                        let bestQuote = null;
                        if (data.quotes && data.quotes.length > 0) {
                            bestQuote = data.quotes.find(q => q.rank == 1) || data.quotes.sort((a,b) => a.rank - b.rank)[0];
                        }
                        const bestPrice = bestQuote ? Number(bestQuote.price) : 0;

                        data.requisitions.forEach((req, index) => {
                            const qty = req.qtyReq || 0;
                            const budgetUnit = req.budget || 0;
                            const quoteTotal = bestPrice * qty; 
                            const tBudget = budgetUnit * qty;   
                            const delta = quoteTotal - tBudget; 

                            flatTableData.push({
                                partNo: data.partNo,
                                realIndex: index,
                                buyer: (req.buyer || "").toString(),
                                reqId: (req.reqId || "").toString(),
                                hull: (req.hull || "").toString(),
                                desc: (data.desc || "").toString(),
                                rank: bestQuote ? bestQuote.rank.toString() : "-",
                                supplier: bestQuote ? bestQuote.supplier : "-",
                                quoteDate: bestQuote ? (bestQuote.date || "-") : "-",
                                qty: qty.toString(),
                                price: bestQuote ? bestPrice.toFixed(2) : "-",
                                total: bestQuote ? quoteTotal.toFixed(2) : "-",
                                budget: budgetUnit.toFixed(2),
                                tBudget: tBudget.toFixed(2),
                                selected: (req.selected || "").toString(),
                                delta: bestQuote ? delta.toFixed(2) : "-",
                                lead: bestQuote ? (bestQuote.lead || "-") : "-",
                                rawDelta: delta,
                                hasQuote: !!bestQuote,
                                isBestRank: bestQuote ? (bestQuote.rank == 1) : false
                            });
                        });
                    }
                });
                filterData();
            } catch (err) {
                console.error("Firebase Error:", err);
                tbody.innerHTML = `<tr><td colspan='17' style='color:red; text-align:center;'>Error loading data: ${err.message}</td></tr>`;
            }
        }

        // 2. FILTER FUNCTION
        window.filterData = () => {
            const inputs = document.querySelectorAll('.col-search');
            filteredData = flatTableData.filter(row => {
                if (!row.buyer.toUpperCase().includes(inputs[0].value.toUpperCase())) return false;
                if (!row.partNo.toUpperCase().includes(inputs[1].value.toUpperCase())) return false;
                if (!row.reqId.toUpperCase().includes(inputs[2].value.toUpperCase())) return false;
                if (!row.hull.toUpperCase().includes(inputs[3].value.toUpperCase())) return false;
                if (!row.desc.toUpperCase().includes(inputs[4].value.toUpperCase())) return false;
                if (!row.rank.toUpperCase().includes(inputs[5].value.toUpperCase())) return false;
                if (!row.supplier.toUpperCase().includes(inputs[6].value.toUpperCase())) return false;
                if (!row.quoteDate.toUpperCase().includes(inputs[7].value.toUpperCase())) return false;
                if (!row.qty.includes(inputs[8].value)) return false;
                if (!row.price.includes(inputs[9].value)) return false;
                if (!row.total.includes(inputs[10].value)) return false;
                if (!row.budget.includes(inputs[11].value)) return false;
                if (!row.tBudget.includes(inputs[12].value)) return false;
                if (!row.selected.toUpperCase().includes(inputs[13].value.toUpperCase())) return false;
                if (!row.delta.includes(inputs[14].value)) return false;
                if (!row.lead.toUpperCase().includes(inputs[15].value.toUpperCase())) return false;
                return true;
            });
            currentPage = 1;
            renderTable();
        }

        // 3. RENDER TABLE
        function renderTable() {
            tbody.innerHTML = "";
            if (filteredData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='17' style='text-align:center; padding:20px;'>No records found matching filters.</td></tr>";
                updateControls();
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);

            pageData.forEach(row => {
                let deltaColor = "#333";
                if(row.hasQuote) {
                    if(row.rawDelta > 0) deltaColor = "#d9534f";
                    if(row.rawDelta <= 0) deltaColor = "#28a745";
                }

                let rankColor = "#ccc";
                if (row.isBestRank) rankColor = "#28a745";
                else if (row.rank == '2') rankColor = "#ffc107";
                
                const buyerColor = getColorForString(row.buyer);
                const hullColor = getColorForString(row.hull);

                const tr = `
                    <tr>
                        <td>
                            <button class="btn-icon" onclick="openEdit('${row.partNo}', ${row.realIndex})" title="Edit Req">✏️</button>
                            <button class="btn-icon btn-del" onclick="deleteReq('${row.partNo}', ${row.realIndex})" title="Delete Line">🗑️</button>
                        </td>
                        <td><span class="buyer-badge" style="background-color:${buyerColor}">${row.buyer}</span></td>
                        <td><a href="detail.html?part=${row.partNo}" class="part-link">${row.partNo}</a></td>
                        <td><span class="req-badge">${row.reqId}</span></td>
                        <td><span class="hull-badge" style="background-color:${hullColor}">${row.hull}</span></td>
                        <td>${row.desc}</td>
                        <td><span style="background:${rankColor}; color:white; padding:2px 6px; border-radius:4px; font-weight:bold;">${row.rank}</span></td>
                        <td>${row.supplier}</td>
                        <td>${row.quoteDate}</td>
                        <td>${row.qty}</td>
                        <td class="col-currency">${row.price === '-' ? '-' : '$'+row.price}</td>
                        <td class="col-currency" style="background:#e8f4ff;">${row.total === '-' ? '-' : '$'+row.total}</td>
                        <td class="col-currency">$${row.budget}</td>
                        <td class="col-currency">$${row.tBudget}</td>
                        <td>${row.selected}</td>
                        <td class="col-currency" style="font-weight:bold; color:${deltaColor};">${row.delta === '-' ? '-' : '$'+row.delta}</td>
                        <td>${row.lead}</td>
                    </tr>
                `;
                tbody.innerHTML += tr;
            });
            updateControls();
        }

        function updateControls() {
            const totalItems = filteredData.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            paginationDiv.innerHTML = `
                <button id="btnPrev" class="btn-nav" ${currentPage===1?'disabled':''}>&#8592; Previous</button>
                <span class="page-info">Showing ${totalItems} Records | Page ${currentPage} of ${totalPages}</span>
                <button id="btnNext" class="btn-nav" ${currentPage===totalPages?'disabled':''}>Next &#8594;</button>
            `;
            document.getElementById('btnPrev').onclick = () => { if(currentPage > 1) { currentPage--; renderTable(); } };
            document.getElementById('btnNext').onclick = () => { if(currentPage < totalPages) { currentPage++; renderTable(); } };
        }

        // --- 4. DELETE LOGIC ---
        window.deleteReq = async (partNo, index) => {
            if(!confirm("Delete this requisition line?")) return;
            try {
                const docRef = doc(db, "parts", partNo);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const updatedReqs = [...data.requisitions];
                    updatedReqs.splice(index, 1);
                    await updateDoc(docRef, { requisitions: updatedReqs });
                    loadInitial();
                }
            } catch (err) { alert("Error: " + err.message); }
        }

        // --- 5. EDIT MODAL LOGIC ---
        let currentEditPart = null;
        let currentEditIndex = null;

        window.openEdit = async (partNo, index) => {
            currentEditPart = partNo;
            currentEditIndex = index;
            const docRef = doc(db, "parts", partNo);
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) return;
            const data = docSnap.data();
            document.getElementById('edit_partNo').value = partNo;
            document.getElementById('edit_desc').value = data.desc || "";
            const req = data.requisitions[index];
            document.getElementById('edit_reqId').value = req.reqId;
            document.getElementById('edit_buyer').value = req.buyer || "";
            document.getElementById('edit_hull').value = req.hull;
            document.getElementById('edit_qty').value = req.qtyReq;
            document.getElementById('edit_uom').value = req.uom;
            document.getElementById('edit_budget').value = req.budget || 0;
            document.getElementById('edit_selected').value = req.selected || "";
            document.querySelector('.modal-title').innerText = "✏️ Modify Requisition";
            document.getElementById('editModal').style.display = 'flex';
        }

        window.closeModal = () => { document.getElementById('editModal').style.display = 'none'; }

        window.saveEdit = async () => {
            const partNo = currentEditPart;
            const index = currentEditIndex;
            try {
                const docRef = doc(db, "parts", partNo);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let updatedReqs = data.requisitions ? [...data.requisitions] : [];
                    const newReqData = {
                        reqId: document.getElementById('edit_reqId').value,
                        buyer: document.getElementById('edit_buyer').value,
                        hull: document.getElementById('edit_hull').value,
                        qtyReq: Number(document.getElementById('edit_qty').value),
                        uom: document.getElementById('edit_uom').value,
                        budget: Number(document.getElementById('edit_budget').value),
                        selected: document.getElementById('edit_selected').value,
                        status: "Open",
                        dateAdded: newReqData && newReqData.dateAdded ? newReqData.dateAdded : new Date().toISOString()
                    };
                    if(data.requisitions[index] && data.requisitions[index].dateAdded) {
                         newReqData.dateAdded = data.requisitions[index].dateAdded;
                    }
                    updatedReqs[index] = newReqData;
                    await updateDoc(docRef, { 
                        requisitions: updatedReqs,
                        desc: document.getElementById('edit_desc').value
                    });
                    closeModal();
                    loadInitial();
                }
            } catch (err) { alert("Error saving: " + err.message); }
        }

        // --- 6. BROWSER NAVIGATION FIX ---
        window.addEventListener('pageshow', (event) => {
            // Force reload if coming from cache/back-button to ensure table is populated
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                loadInitial();
            }
        });

        loadInitial();
    </script>
</body>
</html>
