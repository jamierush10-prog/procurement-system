<script type="module">
        import { db, collection, getDocs, getDoc, doc, updateDoc, deleteDoc, query, where, limit } from './firebase-config.js';

        if (!sessionStorage.getItem("austal_user")) window.location.href = "login.html";

        const tbody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const buyerInput = document.getElementById('buyerFilter');

        // 1. LOAD INITIAL DATA
        window.loadInitial = async () => {
            searchInput.value = "";
            tbody.innerHTML = "<tr><td colspan='17' style='text-align:center; padding:20px;'>Loading full dashboard...</td></tr>";
            try {
                // CHANGED: Increased limit to 10,000 to ensure we find ALL active reqs, 
                // even if they are buried deep in the database amongst quote-only records.
                const q = query(collection(db, "parts"), limit(10000));
                const querySnapshot = await getDocs(q);
                renderTable(querySnapshot);
            } catch (err) {
                console.error("Firebase Error:", err);
                tbody.innerHTML = `<tr><td colspan='17' style='color:red; text-align:center;'>Error loading data: ${err.message}</td></tr>`;
            }
        }

        window.resetAll = () => {
            searchInput.value = "";
            buyerInput.value = "";
            loadInitial();
        }

        // 2. SEARCH FUNCTION
        window.searchData = async () => {
            const term = searchInput.value.trim().toUpperCase();
            tbody.innerHTML = "<tr><td colspan='17' style='text-align:center; padding:20px;'>Searching...</td></tr>";
            
            try {
                let querySnapshot;
                if(term) {
                    // Direct search for Part No
                    const partRef = collection(db, "parts");
                    const q = query(partRef, where("partNo", "==", term));
                    querySnapshot = await getDocs(q);
                } else {
                    // If searching without a Part Number (e.g. just filtering), grab the full list again
                    const q = query(collection(db, "parts"), limit(10000)); 
                    querySnapshot = await getDocs(q);
                }
                renderTable(querySnapshot);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan='17' style='color:red;'>Search Error: ${err.message}</td></tr>`;
            }
        }

        // 3. RENDER TABLE
        function renderTable(snapshot) {
            tbody.innerHTML = "";
            let hasRows = false;
            let scannedCount = 0;
            const buyerFilterTerm = buyerInput.value.trim().toUpperCase();

            if(snapshot.empty) {
                tbody.innerHTML = "<tr><td colspan='17' style='text-align:center; padding:20px;'>No records found in database.</td></tr>";
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                scannedCount++;
                
                // ONLY SHOW IF ACTIVE REQUISITIONS EXIST
                if (data.requisitions && data.requisitions.length > 0) {
                    
                    // Find Best Quote
                    let bestQuote = null;
                    if (data.quotes && data.quotes.length > 0) {
                        bestQuote = data.quotes.find(q => q.rank == 1) || data.quotes.sort((a,b) => a.rank - b.rank)[0];
                    }
                    const bestPrice = bestQuote ? Number(bestQuote.price) : 0;

                    // Iterate Requisitions
                    data.requisitions.forEach((req, index) => {
                        
                        // BUYER FILTER LOGIC
                        const reqBuyer = (req.buyer || "").toUpperCase();
                        if (buyerFilterTerm && !reqBuyer.includes(buyerFilterTerm)) return;

                        hasRows = true;
                        
                        // Calculations
                        const qty = req.qtyReq || 0;
                        const budgetUnit = req.budget || 0;
                        
                        const quoteTotal = bestPrice * qty; 
                        const tBudget = budgetUnit * qty;   
                        const delta = quoteTotal - tBudget; 
                        
                        // Delta Color
                        let deltaColor = "#333";
                        if(bestQuote) {
                            if(delta > 0) deltaColor = "#d9534f"; // Red (Over Budget)
                            if(delta <= 0) deltaColor = "#28a745"; // Green (Under Budget)
                        }

                        const row = `
                            <tr>
                                <td>
                                    <button class="btn-icon" onclick="openEdit('${data.partNo}', ${index})" title="Edit Req">✏️</button>
                                    <button class="btn-icon btn-del" onclick="deleteReq('${data.partNo}', ${index})" title="Delete Line">🗑️</button>
                                </td>
                                <td><span class="buyer-badge">${req.buyer || '-'}</span></td>
                                <td><a href="detail.html?part=${data.partNo}" class="part-link">${data.partNo}</a></td>
                                <td><span class="req-badge">${req.reqId || '-'}</span></td>
                                <td><span class="hull-badge">${req.hull || '-'}</span></td>
                                <td>${data.desc || '-'}</td>
                                <td><span style="background:${bestQuote ? (bestQuote.rank == 1 ? '#28a745' : '#ffc107') : '#ccc'}; color:white; padding:2px 6px; border-radius:4px; font-weight:bold;">${bestQuote ? bestQuote.rank : '-'}</span></td>
                                <td>${bestQuote ? bestQuote.supplier : '-'}</td>
                                <td>${bestQuote ? bestQuote.date : '-'}</td>
                                <td>${qty}</td>
                                <td class="col-currency">${bestQuote ? '$'+bestPrice.toFixed(2) : '-'}</td>
                                <td class="col-currency" style="background:#e8f4ff;">${bestQuote ? '$'+quoteTotal.toLocaleString('en-US', {minimumFractionDigits: 2}) : '-'}</td>
                                <td class="col-currency">$${budgetUnit.toFixed(2)}</td>
                                <td class="col-currency">$${tBudget.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                                <td>${req.selected || '-'}</td>
                                <td class="col-currency" style="font-weight:bold; color:${deltaColor};">${bestQuote ? '$'+delta.toLocaleString('en-US', {minimumFractionDigits: 2}) : '-'}</td>
                                <td>${bestQuote ? bestQuote.lead : '-'}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                }
            });

            if (!hasRows) {
                 tbody.innerHTML = `<tr><td colspan='17' style='text-align:center; padding:20px; color:#666;'>
                    Scanned ${scannedCount} records. No active requisitions found. <br>
                    (Use 'Add Req' to create demand, or 'Quote Search' to find quote-only parts)
                 </td></tr>`;
            }
        }

        // --- 4. DELETE LOGIC ---
        window.deleteReq = async (partNo, index) => {
            if(!confirm("Delete this requisition line?")) return;
            try {
                const docRef = doc(db, "parts", partNo);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const updatedReqs = [...data.requisitions];
                    updatedReqs.splice(index, 1);
                    await updateDoc(docRef, { requisitions: updatedReqs });
                    refreshView();
                }
            } catch (err) { alert("Error: " + err.message); }
        }

        // --- 5. EDIT MODAL LOGIC ---
        let currentEditPart = null;
        let currentEditIndex = null;

        window.openEdit = async (partNo, index) => {
            currentEditPart = partNo;
            currentEditIndex = index;
            
            const docRef = doc(db, "parts", partNo);
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) return;
            const data = docSnap.data();

            document.getElementById('edit_partNo').value = partNo;
            document.getElementById('edit_desc').value = data.desc || "";

            const req = data.requisitions[index];
            document.getElementById('edit_reqId').value = req.reqId;
            document.getElementById('edit_buyer').value = req.buyer || "";
            document.getElementById('edit_hull').value = req.hull;
            document.getElementById('edit_qty').value = req.qtyReq;
            document.getElementById('edit_uom').value = req.uom;
            document.getElementById('edit_budget').value = req.budget || 0;
            document.getElementById('edit_selected').value = req.selected || "";

            document.querySelector('.modal-title').innerText = "✏️ Modify Requisition";
            document.getElementById('editModal').style.display = 'flex';
        }

        window.closeModal = () => { document.getElementById('editModal').style.display = 'none'; }

        window.saveEdit = async () => {
            const partNo = currentEditPart;
            const index = currentEditIndex;
            
            try {
                const docRef = doc(db, "parts", partNo);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let updatedReqs = data.requisitions ? [...data.requisitions] : [];

                    const newReqData = {
                        reqId: document.getElementById('edit_reqId').value,
                        buyer: document.getElementById('edit_buyer').value,
                        hull: document.getElementById('edit_hull').value,
                        qtyReq: Number(document.getElementById('edit_qty').value),
                        uom: document.getElementById('edit_uom').value,
                        budget: Number(document.getElementById('edit_budget').value),
                        selected: document.getElementById('edit_selected').value,
                        status: "Open",
                        dateAdded: new Date().toISOString()
                    };

                    if(updatedReqs[index].dateAdded) newReqData.dateAdded = updatedReqs[index].dateAdded;
                    updatedReqs[index] = newReqData;

                    await updateDoc(docRef, { 
                        requisitions: updatedReqs,
                        desc: document.getElementById('edit_desc').value
                    });

                    closeModal();
                    refreshView();
                }
            } catch (err) { alert("Error saving: " + err.message); }
        }

        function refreshView() { searchData(); }

        loadInitial();
    </script>
