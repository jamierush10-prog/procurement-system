<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Cloud Master</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        
        /* Header Layout */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #0056b3; margin: 0; }
        
        /* Buttons */
        .btn-add { 
            padding: 10px 20px; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            font-size: 14px; 
            transition: opacity 0.3s; 
            color: white;
            display: inline-block;
            margin-left: 10px;
        }
        .btn-add:hover { opacity: 0.9; }
        
        .btn-green { background-color: #28a745; }   /* Single Req */
        .btn-purple { background-color: #6f42c1; }  /* Batch Upload */
        .btn-blue { background-color: #0056b3; }    /* Add Quote */
        
        .btn-search { padding: 10px 20px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: 10px; }
        .btn-search:hover { background-color: #004494; }

        /* Search Bar */
        .search-box { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }

        /* Table Container */
        .table-container { width: 100%; overflow-x: auto; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; height: 75vh; }
        
        /* Table Styling */
        table { width: 100%; border-collapse: collapse; min-width: 1500px; white-space: nowrap; font-size: 14px; }
        thead th { position: sticky; top: 0; background-color: #0056b3; color: white; padding: 12px 15px; text-align: left; z-index: 10; }
        tbody td { padding: 10px 15px; border-bottom: 1px solid #eee; }
        tbody tr:hover { background-color: #f1f1f1; }

        /* Links & Columns */
        a.part-link { color: #0056b3; font-weight: bold; text-decoration: underline; cursor: pointer; }
        a.part-link:hover { color: #003366; }
        
        .col-currency { text-align: right; font-family: 'Courier New', monospace; font-weight: bold; }
        .hull-badge { background-color: #17a2b8; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
        .req-badge { background-color: #e9ecef; color: #495057; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.85em; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>☁️ Procurement Cloud Master</h2>
        <div>
            <a href="add-req.html" class="btn-add btn-green">+ Add Req</a>
            <a href="batch-req.html" class="btn-add btn-purple">⚡ Batch Upload</a>
            <a href="add-quote.html" class="btn-add btn-blue">+ Add Quote</a>
        </div>
    </div>

    <div style="margin-bottom: 15px;">
        <input type="text" id="searchInput" class="search-box" placeholder="Search Part Number..." onkeyup="if(event.key === 'Enter') searchData()">
        <button onclick="searchData()" class="btn-search">Search</button>
        <button onclick="loadInitial()" style="padding: 10px; background:none; border:none; color:#666; cursor:pointer; text-decoration:underline; margin-left:10px;">Reset</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Part No</th>
                    <th>Req ID</th>
                    <th>Hull</th>
                    <th>Description</th>
                    <th>Rank</th>
                    <th>Best Supplier</th>
                    <th>Quote Date</th>
                    <th>QTY (Req)</th>
                    <th>Price (USD)</th>
                    <th>Total (USD)</th>
                    <th>Lead Time</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <script type="module">
        import { db, collection, getDocs, query, where, limit } from './firebase-config.js';

        // --- SECURITY CHECK ---
        if (!sessionStorage.getItem("austal_user")) {
            window.location.href = "login.html";
        }
        // ----------------------

        const tbody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');

        // 1. LOAD INITIAL DATA (Top 20 Records)
        window.loadInitial = async () => {
            searchInput.value = ""; // Clear search box
            tbody.innerHTML = "<tr><td colspan='11' style='text-align:center; padding:20px;'>Loading database...</td></tr>";
            
            try {
                const q = query(collection(db, "parts"), limit(20));
                const querySnapshot = await getDocs(q);
                renderTable(querySnapshot);
            } catch (err) {
                console.error("Firebase Error:", err);
                tbody.innerHTML = `<tr><td colspan='11' style='color:red; text-align:center;'>Error loading data: ${err.message}</td></tr>`;
            }
        }

        // 2. SEARCH FUNCTION
        window.searchData = async () => {
            const term = searchInput.value.trim().toUpperCase(); // Force uppercase to match standard part numbers
            if(!term) return loadInitial();

            tbody.innerHTML = "<tr><td colspan='11' style='text-align:center; padding:20px;'>Searching Cloud...</td></tr>";

            try {
                // Search for Exact Part Number
                const partRef = collection(db, "parts");
                const q = query(partRef, where("partNo", "==", term));
                
                const querySnapshot = await getDocs(q);
                renderTable(querySnapshot);
            } catch (err) {
                console.error("Search Error:", err);
                tbody.innerHTML = `<tr><td colspan='11' style='color:red;'>Search Error: ${err.message}</td></tr>`;
            }
        }

        // 3. RENDER TABLE (Handles Multiple Reqs per Part)
        function renderTable(snapshot) {
            tbody.innerHTML = ""; // Clear loading message

            if(snapshot.empty) {
                tbody.innerHTML = "<tr><td colspan='11' style='text-align:center; padding:20px;'>No records found.</td></tr>";
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                
                // Find Rank 1 Quote (Best Quote)
                let bestQuote = null;
                if (data.quotes && data.quotes.length > 0) {
                    // Try to find Rank 1, otherwise sort by rank and pick first
                    bestQuote = data.quotes.find(q => q.rank == 1) || data.quotes.sort((a,b) => a.rank - b.rank)[0];
                }
                const price = bestQuote ? Number(bestQuote.price) : 0;

                // --- ROW GENERATION LOGIC ---
                // If a part has multiple Requisitions, we generate a row for EACH one.
                // This ensures every project (Hull) gets its own line item and price calculation.

                if (data.requisitions && data.requisitions.length > 0) {
                    data.requisitions.forEach(req => {
                        // Calculate Total specific to THIS Req's quantity
                        const lineTotal = price * (req.qtyReq || 0);

                        const row = `
                            <tr>
                                <td><a href="detail.html?part=${data.partNo}" class="part-link">${data.partNo}</a></td>
                                <td><span class="req-badge">${req.reqId || '-'}</span></td>
                                <td><span class="hull-badge">${req.hull || '-'}</span></td>
                                <td>${data.desc || '-'}</td>
                                <td><span style="background:${bestQuote ? (bestQuote.rank == 1 ? '#28a745' : '#ffc107') : '#ccc'}; color:white; padding:2px 6px; border-radius:4px; font-weight:bold;">${bestQuote ? bestQuote.rank : '-'}</span></td>
                                <td>${bestQuote ? bestQuote.supplier : '-'}</td>
                                <td>${bestQuote ? bestQuote.date : '-'}</td>
                                <td>${req.qtyReq || '-'}</td>
                                <td class="col-currency">${bestQuote ? '$'+price.toFixed(2) : '-'}</td>
                                <td class="col-currency" style="background:#e8f4ff;">${bestQuote ? '$'+lineTotal.toLocaleString('en-US', {minimumFractionDigits: 2}) : '-'}</td>
                                <td>${bestQuote ? bestQuote.lead : '-'}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                } else {
                    // ORPHAN PART: Has Quotes but no active Requisitions
                    // Show one row with dashes for Req info
                    const row = `
                        <tr>
                            <td><a href="detail.html?part=${data.partNo}" class="part-link">${data.partNo}</a></td>
                            <td style="color:#999; font-style:italic;">No Active Req</td>
                            <td>-</td>
                            <td>${data.desc || '-'}</td>
                            <td><span style="background:${bestQuote ? '#28a745' : '#ccc'}; color:white; padding:2px 6px; border-radius:4px; font-weight:bold;">${bestQuote ? bestQuote.rank : '-'}</span></td>
                            <td>${bestQuote ? bestQuote.supplier : '-'}</td>
                            <td>${bestQuote ? bestQuote.date : '-'}</td>
                            <td>-</td>
                            <td class="col-currency">${bestQuote ? '$'+price.toFixed(2) : '-'}</td>
                            <td class="col-currency">-</td>
                            <td>${bestQuote ? bestQuote.lead : '-'}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                }
            });
        }

        // Load data immediately when page opens
        loadInitial();
    </script>
</body>
</html>
