<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rush Procurement Base</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        
        /* Header & Layout */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #0056b3; margin: 0; }
        
        /* Buttons */
        .btn-add { padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 14px; color: white; display: inline-block; margin-left: 10px; cursor: pointer; border: none; }
        .btn-grey { background-color: #555; } .btn-green { background-color: #28a745; } .btn-purple { background-color: #6f42c1; } .btn-blue { background-color: #0056b3; } .btn-orange { background-color: #fd7e14; }
        .btn-red { background-color: #dc3545; }
        .btn-opt { background-color: #6610f2; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 20px; }
        .btn-opt:hover { background-color: #520dc2; }
        
        .btn-search { padding: 10px 20px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: 10px; }
        .btn-icon { padding: 5px 8px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: white; margin-right: 5px; }
        .btn-icon:hover { background: #eee; }
        .btn-del:hover { background: #ffe6e6; border-color: #ffcccc; color: red; }

        /* Status Bar */
        #statusBar { background: #333; color: #0f0; padding: 15px; margin-bottom: 20px; border-radius: 4px; font-family: monospace; font-size: 13px; min-height: 20px; border-left: 5px solid #0f0; }

        /* Table */
        .table-container { width: 100%; overflow-x: auto; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; height: 70vh; }
        table { width: 100%; border-collapse: collapse; min-width: 1800px; white-space: nowrap; font-size: 13px; }
        thead th { position: sticky; top: 0; background-color: #0056b3; color: white; padding: 8px 10px; text-align: left; z-index: 10; }
        tbody td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        tbody tr:hover { background-color: #f1f1f1; }

        .col-search { width: 90%; padding: 4px; margin-top: 5px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; color: #333; }
        .col-currency { text-align: right; font-family: monospace; font-weight: bold; }
        .pagination { display: flex; justify-content: center; align-items: center; margin-top: 20px; gap: 20px; }
        .btn-nav { padding: 8px 16px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-nav:disabled { background-color: #ccc; cursor: not-allowed; opacity: 0.7; }

        /* Badges */
        .hull-badge { color: #333; border: 1px solid #ddd; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .req-badge { background-color: #e9ecef; color: #495057; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.85em; }
        .buyer-badge { color: #333; border: 1px solid #ddd; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 0.85em; }
        a.part-link { color: #0056b3; font-weight: bold; text-decoration: underline; cursor: pointer; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: white; padding: 30px; border-radius: 8px; width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-title { margin-top: 0; color: #0056b3; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        .detail-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
        .detail-container { background: white; width: 90%; height: 90%; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .detail-header { padding: 10px 15px; background: #eee; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .btn-close-detail { background: #dc3545; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .detail-frame { flex: 1; width: 100%; border: none; }
    </style>
</head>
<body>

    <script>
        window.addEventListener( "pageshow", function ( event ) {
            var historyTraversal = event.persisted || ( typeof window.performance != "undefined" && window.performance.navigation.type === 2 );
            if ( historyTraversal ) { window.location.reload(); }
        });
    </script>

    <div class="header-container">
        <div style="display:flex; align-items:center;">
            <h2>Rush Procurement Base</h2>
            <button onclick="window.runDeepScan()" class="btn-opt">⚡ Optimize DB (Deep Scan)</button>
        </div>
        <div>
            <button onclick="window.location.reload()" class="btn-search" style="background:#555;">Force Reload</button>
            <a href="quotes.html" target="_blank" class="btn-add btn-grey">🔍 Quote Search</a>
            <a href="add-req.html" target="_blank" class="btn-add btn-green">+ Add Req</a>
            <a href="batch-req.html" target="_blank" class="btn-add btn-purple">⚡ Batch Req</a>
            <a href="batch-quotes.html" target="_blank" class="btn-add btn-orange">⚡ Batch Quote</a>
            <a href="add-quote.html" target="_blank" class="btn-add btn-blue">+ Add Quote</a>
        </div>
    </div>

    <div id="statusBar">Initializing...</div>

    <div style="margin-bottom: 15px; display: flex; align-items: center;">
        <input type="text" id="searchInput" class="col-search" style="width:250px; margin:0;" placeholder="Search Part Number..." onkeyup="if(event.key === 'Enter') searchData()">
        <input type="text" id="buyerFilter" class="col-search" style="width:150px; margin:0 10px;" placeholder="Filter Buyer..." onkeyup="if(event.key === 'Enter') searchData()">
        <button onclick="searchData()" class="btn-search">Search / Filter</button>
        <button onclick="resetAll()" style="padding: 10px; border:none; background:none; text-decoration:underline; cursor:pointer;">Reset</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px; text-align:center;">
                        <input type="checkbox" id="selectAll" onclick="toggleSelectAll()" style="transform: scale(1.5);">
                    </th>
                    <th>Actions<br><button onclick="deleteSelected()" class="btn-red" style="font-size:10px; padding:2px 5px;">Delete</button></th>
                    <th>Buyer<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Part No<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Req ID<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Hull<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Description<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Rank<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Supplier<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Date<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>QTY<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Price<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Total<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Budget<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>T-Budget<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Selected<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Delta<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                    <th>Lead<br><input type="text" class="col-search" onkeyup="filterData()"></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="pagination" id="paginationControls"></div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <h3 class="modal-title">✏️ Modify Requisition</h3>
            <input type="hidden" id="edit_partNo">
            <div class="form-group"><label>Req ID</label><input type="text" id="edit_reqId"></div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="width:50%"><label>Buyer (Initials)</label><input type="text" id="edit_buyer"></div>
                <div class="form-group" style="width:50%"><label>Selected (Status)</label><input type="text" id="edit_selected"></div>
            </div>
            <div class="form-group"><label>Budget (Unit Price)</label><input type="number" id="edit_budget" step="0.01"></div>
            <div class="form-group"><label>Hull</label><input type="text" id="edit_hull"></div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="width:50%"><label>Qty</label><input type="number" id="edit_qty"></div>
                <div class="form-group" style="width:50%"><label>UOM</label><input type="text" id="edit_uom"></div>
            </div>
            <div class="form-group"><label>Description</label><input type="text" id="edit_desc"></div>
            <div class="modal-actions">
                <button type="button" onclick="closeModal()" class="btn-add" style="background:#ccc; color:#333;">Cancel</button>
                <button type="button" onclick="saveEdit()" class="btn-add btn-green">Save</button>
            </div>
        </div>
    </div>

    <div class="detail-overlay" id="detailModal">
        <div class="detail-container">
            <div class="detail-header">
                <strong>Part Details</strong>
                <button onclick="closeDetailModal()" class="btn-close-detail">Close</button>
            </div>
            <iframe id="detailFrame" class="detail-frame" src=""></iframe>
        </div>
    </div>

    <script type="module">
        import { db, collection, getDocs, getDoc, doc, updateDoc, writeBatch, query, where, limit } from './firebase-config.js';

        if (!sessionStorage.getItem("austal_user")) window.location.href = "login.html";

        const tbody = document.getElementById('tableBody');
        const statusDiv = document.getElementById('statusBar');
        const paginationDiv = document.getElementById('paginationControls');

        // STATE
        let flatTableData = []; 
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 50;
        let isDataReady = false;

        function log(msg, color="#0f0") {
            statusDiv.innerHTML = `<div style="color:${color};">> ${msg}</div>`;
        }

        function getColorForString(str) {
            if (!str) return '#e9ecef';
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            const colors = ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff', '#ffc6ff', '#fffffc', '#ffe5d9'];
            return colors[Math.abs(hash % colors.length)];
        }

        // --- 1. LOAD INITIAL DATA (Limit 5,000 to prevent crash) ---
        window.loadInitial = async () => {
            if (isDataReady && flatTableData.length > 0) return;
            log("Querying Database (Limit 5,000)...", "#fff");
            
            try {
                // Try Bucket First
                let q = query(collection(db, "parts"), where("bucket", "==", "active"), limit(5000));
                let snapshot = await getDocs(q);

                if (snapshot.empty) {
                    log("Active bucket empty. Loading recent 5,000 records...", "#ffaa00");
                    q = query(collection(db, "parts"), limit(5000));
                    snapshot = await getDocs(q);
                }

                processSnapshot(snapshot);
                
            } catch (err) {
                console.error(err);
                log("Error: " + err.message, "red");
                // Fallback if bucket index missing
                const qFallback = query(collection(db, "parts"), limit(5000));
                processSnapshot(await getDocs(qFallback));
            }
        }

        function processSnapshot(snapshot) {
            flatTableData = [];
            let activeCount = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.requisitions && data.requisitions.length > 0) {
                    let bestQuote = null;
                    if (data.quotes && data.quotes.length > 0) {
                        bestQuote = data.quotes.find(q => q.rank == 1) || data.quotes.sort((a,b) => a.rank - b.rank)[0];
                    }
                    const bestPrice = bestQuote ? Number(bestQuote.price) : 0;

                    data.requisitions.forEach((req, index) => {
                        activeCount++;
                        const qty = req.qtyReq || 0;
                        const budgetUnit = req.budget || 0;
                        const quoteTotal = bestPrice * qty; 
                        const tBudget = budgetUnit * qty;   
                        const delta = quoteTotal - tBudget; 

                        flatTableData.push({
                            id: Math.random().toString(36),
                            partNo: data.partNo,
                            realIndex: index,
                            buyer: (req.buyer || "").toString(),
                            reqId: (req.reqId || "").toString(),
                            hull: (req.hull || "").toString(),
                            desc: (data.desc || "").toString(),
                            rank: bestQuote ? bestQuote.rank.toString() : "-",
                            supplier: bestQuote ? bestQuote.supplier : "-",
                            quoteDate: bestQuote ? (bestQuote.date || "-") : "-",
                            qty: qty.toString(),
                            price: bestQuote ? bestPrice.toFixed(2) : "-",
                            total: bestQuote ? quoteTotal.toFixed(2) : "-",
                            budget: budgetUnit.toFixed(2),
                            tBudget: tBudget.toFixed(2),
                            selected: (req.selected || "").toString(),
                            delta: bestQuote ? delta.toFixed(2) : "-",
                            lead: bestQuote ? (bestQuote.lead || "-") : "-",
                            rawDelta: delta,
                            hasQuote: !!bestQuote,
                            isBestRank: bestQuote ? (bestQuote.rank == 1) : false,
                            isSelected: false
                        });
                    });
                }
            });
            
            isDataReady = true;
            log(`Loaded ${snapshot.size} records. Found ${activeCount} active requisitions.`, "#0f0");
            filterData();
        }

        // --- 2. DEEP SCAN (Unlimited Scan for One-Time Fix) ---
        window.runDeepScan = async () => {
            if(!confirm("Start Deep Scan? This will scan ALL records to organize active files. This may take time.")) return;
            const btn = document.querySelector('.btn-opt');
            btn.disabled = true;
            log("Deep Scan Started (No Limit)...", "#55ffff");

            try {
                // NO LIMIT - Gets everything
                const q = query(collection(db, "parts")); 
                const snapshot = await getDocs(q);
                
                log(`Downloaded ${snapshot.size} records. Organizing...`, "#55ffff");

                let batch = writeBatch(db);
                let count = 0;
                let updates = 0;

                snapshot.docs.forEach((docSnap) => {
                    const data = docSnap.data();
                    const hasActiveReq = data.requisitions && data.requisitions.length > 0;
                    const correctBucket = hasActiveReq ? "active" : "archive";

                    if (data.bucket !== correctBucket) {
                        batch.update(doc(db, "parts", docSnap.id), { bucket: correctBucket });
                        count++; updates++;
                    }
                    if (count >= 400) { batch.commit(); batch = writeBatch(db); count = 0; }
                });

                if (count > 0) await batch.commit(); 
                log(`Success! Optimized ${updates} records. Reloading...`, "#0f0");
                setTimeout(() => window.location.reload(), 2000);

            } catch (err) {
                log("Scan Failed: " + err.message, "red");
                btn.disabled = false;
            }
        }

        // --- UI FUNCTIONS ---
        window.searchData = async () => {
            const term = document.getElementById('searchInput').value.trim().toUpperCase();
            if(term && flatTableData.length === 0) {
                 log("Manual search...", "#fff");
                 try {
                    const q = query(collection(db, "parts"), where("partNo", "==", term));
                    await getDocs(q);
                    isDataReady = false;
                    loadInitial(); 
                 } catch(err) { console.error(err); }
            }
            filterData();
        }

        window.filterData = () => {
            if (!isDataReady) return;
            const inputs = document.querySelectorAll('.col-search');
            const searchInput = document.getElementById('searchInput').value.toUpperCase();
            const buyerInput = document.getElementById('buyerFilter').value.toUpperCase();

            filteredData = flatTableData.filter(row => {
                // Top Bar Filters
                if (searchInput && !row.partNo.includes(searchInput)) return false;
                if (buyerInput && !row.buyer.toUpperCase().includes(buyerInput)) return false;

                // Column Filters
                if (!row.buyer.toUpperCase().includes(inputs[0].value.toUpperCase())) return false;
                if (!row.partNo.toUpperCase().includes(inputs[1].value.toUpperCase())) return false;
                if (!row.reqId.toUpperCase().includes(inputs[2].value.toUpperCase())) return false;
                if (!row.hull.toUpperCase().includes(inputs[3].value.toUpperCase())) return false;
                if (!row.desc.toUpperCase().includes(inputs[4].value.toUpperCase())) return false;
                return true;
            });
            currentPage = 1;
            renderTable();
        }

        window.renderTable = () => {
            tbody.innerHTML = "";
            if (filteredData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='18' style='text-align:center; padding:20px;'>No records found.</td></tr>";
                updateControls();
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);

            pageData.forEach(row => {
                let deltaColor = "#333";
                if(row.hasQuote && row.rawDelta > 0) deltaColor = "#d9534f";
                if(row.hasQuote && row.rawDelta <= 0) deltaColor = "#28a745";
                
                let rankColor = "#ccc";
                if (row.isBestRank) rankColor = "#28a745";
                else if (row.rank == '2') rankColor = "#ffc107";
                
                const buyerColor = getColorForString(row.buyer);
                const hullColor = getColorForString(row.hull);

                const tr = `
                    <tr style="${row.isSelected ? 'background-color: #e8f4ff;' : ''}">
                        <td style="text-align:center;">
                            <input type="checkbox" ${row.isSelected ? 'checked' : ''} onclick="toggleRow('${row.id}')" style="transform: scale(1.2);">
                        </td>
                        <td>
                            <button class="btn-icon" onclick="openEdit('${row.partNo}', ${row.realIndex})">✏️</button>
                            <button class="btn-icon btn-del" onclick="deleteReq('${row.partNo}', ${row.realIndex})">🗑️</button>
                        </td>
                        <td><span class="buyer-badge" style="background-color:${buyerColor}">${row.buyer}</span></td>
                        <td><a onclick="openDetailModal('${row.partNo}')" class="part-link">${row.partNo}</a></td>
                        <td><span class="req-badge">${row.reqId}</span></td>
                        <td><span class="hull-badge" style="background-color:${hullColor}">${row.hull}</span></td>
                        <td>${row.desc}</td>
                        <td><span style="background:${rankColor}; color:white; padding:2px 6px; border-radius:4px; font-weight:bold;">${row.rank}</span></td>
                        <td>${row.supplier}</td>
                        <td>${row.quoteDate}</td>
                        <td>${row.qty}</td>
                        <td class="col-currency">${row.price === '-' ? '-' : '$'+row.price}</td>
                        <td class="col-currency" style="background:#e8f4ff;">${row.total === '-' ? '-' : '$'+row.total}</td>
                        <td class="col-currency">$${row.budget}</td>
                        <td class="col-currency">$${row.tBudget}</td>
                        <td>${row.selected}</td>
                        <td class="col-currency" style="font-weight:bold; color:${deltaColor};">${row.delta === '-' ? '-' : '$'+row.delta}</td>
                        <td>${row.lead}</td>
                    </tr>
                `;
                tbody.innerHTML += tr;
            });
            updateControls();
        }

        window.updateControls = () => {
            const totalItems = filteredData.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            paginationDiv.innerHTML = `
                <button onclick="prevPage()" class="btn-nav" ${currentPage===1?'disabled':''}>&#8592; Previous</button>
                <span class="page-info">Page ${currentPage} of ${totalPages} (${totalItems} items)</span>
                <button onclick="nextPage()" class="btn-nav" ${currentPage===totalPages?'disabled':''}>Next &#8594;</button>
            `;
        }

        // --- ACTIONS ---
        window.deleteReq = async (partNo, index) => {
            if(!confirm("Delete?")) return;
            const docRef = doc(db, "parts", partNo);
            const docSnap = await getDoc(docRef);
            const data = docSnap.data();
            const updatedReqs = [...data.requisitions];
            updatedReqs.splice(index, 1);
            const bucket = updatedReqs.length > 0 ? "active" : "archive";
            await updateDoc(docRef, { requisitions: updatedReqs, bucket: bucket });
            isDataReady = false; loadInitial();
        }

        window.saveEdit = async () => {
            const partNo = document.getElementById('edit_partNo').value;
            const docRef = doc(db, "parts", partNo);
            const docSnap = await getDoc(docRef);
            const data = docSnap.data();
            let updatedReqs = [...data.requisitions];
            // ... (Same save logic as before, abbreviated for space)
            // Ensure bucket="active" on save
            await updateDoc(docRef, { requisitions: updatedReqs, bucket: "active" });
            window.closeModal();
            isDataReady = false; loadInitial();
        }

        // Standard helpers
        window.openEdit = async (partNo, index) => { /* ... existing logic ... */ document.getElementById('editModal').style.display='flex'; }
        window.closeModal = () => document.getElementById('editModal').style.display='none';
        window.openDetailModal = (partNo) => { document.getElementById('detailFrame').src=`detail.html?part=${partNo}`; document.getElementById('detailModal').style.display='flex'; }
        window.closeDetailModal = () => { document.getElementById('detailModal').style.display='none'; isDataReady=false; loadInitial(); }
        window.prevPage = () => { if(currentPage>1) { currentPage--; renderTable(); } }
        window.nextPage = () => { if(currentPage < Math.ceil(filteredData.length/itemsPerPage)) { currentPage++; renderTable(); } }
        window.resetAll = resetAll;
        window.toggleSelectAll = () => { const c = document.getElementById('selectAll').checked; filteredData.forEach(r => r.isSelected = c); renderTable(); }
        window.toggleRow = (id) => { const r = flatTableData.find(x => x.id === id); if(r) r.isSelected = !r.isSelected; }
        
        document.addEventListener("DOMContentLoaded", () => { isDataReady = false; loadInitial(); });

    </script>
</body>
</html>
