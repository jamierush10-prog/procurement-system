<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part Details</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #fff; color: #333; }
        
        h1 { color: #0056b3; margin-bottom: 5px; }
        .sub-header { color: #666; margin-bottom: 20px; font-size: 14px; }

        /* Card Layout */
        .info-cards { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { flex: 1; padding: 15px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; }
        .card label { display: block; font-weight: bold; font-size: 11px; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .card div { font-size: 16px; font-weight: 500; }

        /* Sections */
        h3 { border-bottom: 2px solid #0056b3; padding-bottom: 5px; margin-top: 30px; color: #333; font-size: 16px; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background: #0056b3; color: white; text-align: left; padding: 8px; }
        td { border-bottom: 1px solid #eee; padding: 8px; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        /* Badges */
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; }
        .bg-green { background: #28a745; }
        .bg-grey { background: #6c757d; }
        .bg-blue { background: #17a2b8; }

        /* Buttons */
        .btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; color: white; font-size: 12px; }
        .btn-add { background-color: #28a745; float: right; margin-top: -30px; }
        .btn-edit { background-color: #ffc107; color: black; }
        .btn-del { background-color: #dc3545; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 20px; border-radius: 5px; width: 400px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        .form-row { margin-bottom: 10px; }
        .form-row label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 3px; }
        .form-row input, .form-row select { width: 100%; padding: 6px; box-sizing: border-box; }
        .modal-btns { text-align: right; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="loading">Loading details...</div>

    <div id="content" style="display:none;">
        <h1 id="partNoDisplay">---</h1>
        
        <div class="info-cards">
            <div class="card">
                <label>Description</label>
                <div id="descDisplay">-</div>
            </div>
            <div class="card">
                <label>Active Projects</label>
                <div id="projectCount">0</div>
            </div>
        </div>

        <h3>📄 Demand (Requisitions)</h3>
        <table>
            <thead>
                <tr>
                    <th>Req ID</th>
                    <th>Buyer</th>
                    <th>Hull / Project</th>
                    <th>Qty Required</th>
                    <th>UOM</th>
                    <th>Status</th>
                    <th>Date Added</th>
                </tr>
            </thead>
            <tbody id="reqTable"></tbody>
        </table>

        <h3>
            💰 Supply (Quotes)
            <button onclick="openQuoteModal()" class="btn btn-add">+ Add Quote</button>
        </h3>
        <table>
            <thead>
                <tr>
                    <th>Actions</th>
                    <th>Rank</th>
                    <th>Supplier</th>
                    <th>Quote Date</th>
                    <th>MFG No</th>
                    <th>Quote File</th>
                    <th>QTY</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Lead Time</th>
                    <th>Valid Until</th>
                </tr>
            </thead>
            <tbody id="quoteTable"></tbody>
        </table>
    </div>

    <div class="modal-overlay" id="quoteModal">
        <div class="modal-box">
            <h3 id="modalTitle" style="margin-top:0;">Add Quote</h3>
            <input type="hidden" id="q_index">
            
            <div class="form-row"><label>Supplier Name</label><input type="text" id="q_supplier"></div>
            <div style="display:flex; gap:10px;">
                <div class="form-row" style="width:50%"><label>Quote Date</label><input type="date" id="q_date"></div>
                <div class="form-row" style="width:50%"><label>Valid Until</label><input type="date" id="q_valid"></div>
            </div>
            <div style="display:flex; gap:10px;">
                <div class="form-row" style="width:50%"><label>Price (Unit)</label><input type="number" id="q_price" step="0.01"></div>
                <div class="form-row" style="width:50%"><label>Min Qty</label><input type="number" id="q_qty" value="1"></div>
            </div>
            <div class="form-row"><label>Lead Time (Days/Weeks)</label><input type="text" id="q_lead"></div>
            <div class="form-row"><label>MFG Part No</label><input type="text" id="q_mfg"></div>
            <div class="form-row"><label>Quote File Ref</label><input type="text" id="q_file"></div>
            
            <div class="modal-btns">
                <button onclick="closeQuoteModal()" class="btn bg-grey">Cancel</button>
                <button onclick="saveQuote()" class="btn bg-green">Save Quote</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, doc, getDoc, updateDoc } from './firebase-config.js';

        // Auth Check (localStorage first)
        const user = localStorage.getItem("austal_user") || sessionStorage.getItem("austal_user");
        if (!user) window.location.href = "login.html";

        const params = new URLSearchParams(window.location.search);
        const partNo = params.get('part');
        let currentDoc = null;
        let isEditing = false;

        async function loadPart() {
            if (!partNo) return alert("No Part Number provided!");
            
            try {
                const docRef = doc(db, "parts", partNo);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    currentDoc = docSnap.data();
                    renderPage();
                } else {
                    document.body.innerHTML = "<h3>Part not found in database.</h3>";
                }
            } catch (err) {
                alert("Error loading: " + err.message);
            }
        }

        function renderPage() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            // Header Info
            document.getElementById('partNoDisplay').innerText = partNo;
            document.getElementById('descDisplay').innerText = currentDoc.desc || "No Description";
            
            // Requisitions
            const reqTable = document.getElementById('reqTable');
            reqTable.innerHTML = "";
            let projects = new Set();
            
            if (currentDoc.requisitions && currentDoc.requisitions.length > 0) {
                currentDoc.requisitions.forEach(req => {
                    projects.add(req.hull);
                    reqTable.innerHTML += `
                        <tr>
                            <td><span class="badge bg-grey">${req.reqId}</span></td>
                            <td>${req.buyer}</td>
                            <td><span class="badge bg-blue">${req.hull}</span></td>
                            <td>${req.qtyReq}</td>
                            <td>${req.uom}</td>
                            <td>${req.status || 'Open'}</td>
                            <td>${req.dateAdded || '-'}</td>
                        </tr>
                    `;
                });
            } else {
                reqTable.innerHTML = "<tr><td colspan='7' style='text-align:center'>No active requisitions</td></tr>";
            }
            document.getElementById('projectCount').innerText = projects.size;

            // Quotes
            const quoteTable = document.getElementById('quoteTable');
            quoteTable.innerHTML = "";
            
            if (currentDoc.quotes && currentDoc.quotes.length > 0) {
                // Sort by Rank
                const sortedQuotes = currentDoc.quotes.sort((a,b) => (a.rank || 999) - (b.rank || 999));
                
                sortedQuotes.forEach((q, index) => {
                    const total = (parseFloat(q.price) * parseFloat(q.qty || 1)).toFixed(2);
                    quoteTable.innerHTML += `
                        <tr>
                            <td>
                                <button onclick="editQuote(${index})" class="btn btn-edit">✏️</button>
                                <button onclick="deleteQuote(${index})" class="btn btn-del">🗑️</button>
                            </td>
                            <td><span class="badge bg-green">${q.rank || '-'}</span></td>
                            <td>${q.supplier}</td>
                            <td>${q.date}</td>
                            <td>${q.mfg || '-'}</td>
                            <td>${q.file || '-'}</td>
                            <td>${q.qty || 1}</td>
                            <td>$${q.price}</td>
                            <td>$${total}</td>
                            <td>${q.lead}</td>
                            <td>${q.validUntil || '-'}</td>
                        </tr>
                    `;
                });
            } else {
                quoteTable.innerHTML = "<tr><td colspan='11' style='text-align:center'>No quotes available</td></tr>";
            }
        }

        // --- QUOTE LOGIC ---
        window.openQuoteModal = () => {
            isEditing = false;
            document.getElementById('modalTitle').innerText = "Add New Quote";
            // Clear fields
            document.getElementById('q_supplier').value = "";
            document.getElementById('q_date').value = new Date().toISOString().split('T')[0];
            document.getElementById('q_price').value = "";
            document.getElementById('q_lead').value = "";
            document.getElementById('quoteModal').style.display = "flex";
        }

        window.editQuote = (index) => {
            isEditing = true;
            document.getElementById('modalTitle').innerText = "Edit Quote";
            document.getElementById('q_index').value = index;
            const q = currentDoc.quotes[index];
            
            document.getElementById('q_supplier').value = q.supplier;
            document.getElementById('q_date').value = q.date;
            document.getElementById('q_valid').value = q.validUntil || "";
            document.getElementById('q_price').value = q.price;
            document.getElementById('q_qty').value = q.qty || 1;
            document.getElementById('q_lead').value = q.lead;
            document.getElementById('q_mfg').value = q.mfg || "";
            document.getElementById('q_file').value = q.file || "";
            
            document.getElementById('quoteModal').style.display = "flex";
        }

        window.closeQuoteModal = () => { document.getElementById('quoteModal').style.display = "none"; }

        window.saveQuote = async () => {
            const newQuote = {
                supplier: document.getElementById('q_supplier').value,
                date: document.getElementById('q_date').value,
                validUntil: document.getElementById('q_valid').value,
                price: parseFloat(document.getElementById('q_price').value).toFixed(2),
                qty: parseInt(document.getElementById('q_qty').value) || 1,
                lead: document.getElementById('q_lead').value,
                mfg: document.getElementById('q_mfg').value,
                file: document.getElementById('q_file').value,
                rank: 999 // Default rank, logic to sort can be added later
            };

            let updatedQuotes = currentDoc.quotes || [];

            if (isEditing) {
                const idx = document.getElementById('q_index').value;
                // Preserve rank if editing
                newQuote.rank = updatedQuotes[idx].rank;
                updatedQuotes[idx] = newQuote;
            } else {
                // Auto-rank: if it's the only quote, rank 1
                if(updatedQuotes.length === 0) newQuote.rank = 1;
                updatedQuotes.push(newQuote);
            }

            // Recalculate Ranks based on price (Simple logic: Lowest price = Rank 1)
            updatedQuotes.sort((a,b) => parseFloat(a.price) - parseFloat(b.price));
            updatedQuotes.forEach((q, i) => q.rank = i + 1);

            try {
                await updateDoc(doc(db, "parts", partNo), { quotes: updatedQuotes });
                closeQuoteModal();
                loadPart(); // Reload page data
            } catch(err) { alert("Error saving quote: " + err.message); }
        }

        window.deleteQuote = async (index) => {
            if(!confirm("Delete this quote?")) return;
            const updatedQuotes = [...currentDoc.quotes];
            updatedQuotes.splice(index, 1);
            
            // Re-rank
            updatedQuotes.forEach((q, i) => q.rank = i + 1);

            try {
                await updateDoc(doc(db, "parts", partNo), { quotes: updatedQuotes });
                loadPart();
            } catch(err) { alert("Error deleting: " + err.message); }
        }

        // Initialize
        loadPart();

        // Bind global
        window.openQuoteModal = openQuoteModal;
        window.closeQuoteModal = closeQuoteModal;
        window.saveQuote = saveQuote;
        window.editQuote = editQuote;
        window.deleteQuote = deleteQuote;

    </script>
</body>
</html>
